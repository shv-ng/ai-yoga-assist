<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoga Assist — Backend Tester</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0a0f;
    --surface:   #111118;
    --surface2:  #1a1a24;
    --border:    #2a2a38;
    --accent:    #7c6af7;
    --accent2:   #4fd1a5;
    --danger:    #f76a6a;
    --warn:      #f7b86a;
    --text:      #e8e6f0;
    --muted:     #6b6880;
    --mono:      'DM Mono', monospace;
    --display:   'Syne', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr 340px;
    grid-template-areas:
      "header header"
      "feed   panel"
      "footer footer";
    gap: 0;
  }

  /* ── Header ── */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .logo span { color: var(--accent); }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    font-size: 11px;
    color: var(--muted);
    transition: all 0.3s;
  }
  .status-pill.connected { border-color: var(--accent2); color: var(--accent2); }
  .status-pill.error     { border-color: var(--danger);  color: var(--danger); }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .connected .dot { background: var(--accent2); animation: pulse 2s infinite; }
  .error .dot     { background: var(--danger); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* ── Video feed ── */
  .feed-area {
    grid-area: feed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    gap: 20px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* subtle grid background */
  .feed-area::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.25;
    pointer-events: none;
  }

  .video-wrapper {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #000;
    max-width: 640px;
    width: 100%;
    aspect-ratio: 4/3;
  }

  video, canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
  }

  canvas { display: none; }

  /* corner brackets */
  .corner { position: absolute; width: 20px; height: 20px; z-index: 10; }
  .corner.tl { top: 10px; left: 10px;  border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner.tr { top: 10px; right: 10px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .corner.bl { bottom: 10px; left: 10px;  border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner.br { bottom: 10px; right: 10px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

  .overlay-label {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 11px;
    color: var(--muted);
    z-index: 10;
    white-space: nowrap;
  }

  /* sending flash */
  .video-wrapper.sending::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    border: 2px solid var(--accent);
    animation: sendflash 0.3s ease-out forwards;
    pointer-events: none;
    z-index: 20;
  }
  @keyframes sendflash { from { opacity: 1; } to { opacity: 0; } }

  .controls {
    display: flex;
    gap: 12px;
    z-index: 1;
  }

  button {
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 22px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  #btn-start {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }
  #btn-start:hover { background: #9b8df9; border-color: #9b8df9; color: #fff; }
  #btn-start.running {
    background: var(--surface2);
    border-color: var(--danger);
    color: var(--danger);
  }

  /* ── Right panel ── */
  .panel {
    grid-area: panel;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-section {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }

  .section-title {
    font-family: var(--display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* Server config */
  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  input[type="text"] {
    flex: 1;
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  #btn-ping {
    padding: 8px 14px;
    font-size: 11px;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .stat-value {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
  }
  .stat-value.accent  { color: var(--accent); }
  .stat-value.success { color: var(--accent2); }
  .stat-value.danger  { color: var(--danger); }

  /* FPS slider */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .slider-val {
    font-size: 12px;
    color: var(--accent);
    min-width: 32px;
    text-align: right;
  }

  /* Last voice */
  .voice-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    min-height: 54px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }

  .voice-icon {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
  }

  .voice-text {
    flex: 1;
    color: var(--text);
    line-height: 1.5;
    font-size: 12px;
  }

  .voice-id-badge {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* playing shimmer */
  .voice-box.playing::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(124,106,247,0.12), transparent);
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* Log */
  .log-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    max-height: 20vh;
  }

  .log-entry {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 8px;
    font-size: 11px;
    line-height: 1.5;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    animation: fadein 0.2s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .log-time { color: var(--muted); font-size: 10px; padding-top: 1px; }
  .log-msg  { color: var(--text); }
  .log-msg.ok   { color: var(--accent2); }
  .log-msg.err  { color: var(--danger); }
  .log-msg.warn { color: var(--warn); }
  .log-msg.info { color: var(--accent); }

  /* Footer */
  footer {
    grid-area: footer;
    padding: 10px 28px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }

  .footer-right { display: flex; gap: 20px; }

  #latency-bar {
    display: flex; align-items: center; gap: 8px;
  }
  .latency-track {
    width: 80px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .latency-fill {
    height: 100%;
    background: var(--accent2);
    border-radius: 2px;
    transition: width 0.3s, background 0.3s;
    width: 0%;
  }
</style>
</head>
<body>

<header>
  <div class="logo">yoga<span>.</span>assist <span style="font-size:13px;font-weight:400;color:var(--muted);margin-left:8px;">browser tester</span></div>
  <div class="status-pill" id="status-pill">
    <div class="dot"></div>
    <span id="status-text">not connected</span>
  </div>
</header>

<!-- Video feed -->
<main class="feed-area">
  <div class="video-wrapper" id="video-wrapper">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="overlay-label" id="overlay-label">camera off</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div class="controls">
    <button id="btn-start" onclick="toggleSession()">▶ start session</button>
    <button id="btn-snapshot" onclick="sendOnce()" disabled>↑ send once</button>
  </div>
</main>

<!-- Right panel -->
<aside class="panel">

  <div class="panel-section">
    <div class="section-title">server</div>
    <div class="input-row">
      <input type="text" id="server-url" value="http://localhost:8000" placeholder="http://192.168.1.x:8000">
      <button id="btn-ping" onclick="pingServer()">ping</button>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-title">stats</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">frames sent</div>
        <div class="stat-value accent" id="stat-frames">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">errors</div>
        <div class="stat-value danger" id="stat-errors">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">voice plays</div>
        <div class="stat-value success" id="stat-plays">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">avg latency</div>
        <div class="stat-value" id="stat-latency">—</div>
      </div>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-title">frame rate</div>
    <div class="slider-row">
      <input type="range" id="fps-slider" min="1" max="10" value="2" oninput="updateFps(this.value)">
      <span class="slider-val" id="fps-val">2 fps</span>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-title">last voice feedback</div>
    <div class="voice-box" id="voice-box">
      <div class="voice-icon">♪</div>
      <div>
        <div class="voice-text" id="voice-text">—</div>
        <div class="voice-id-badge" id="voice-id-badge"></div>
      </div>
    </div>
  </div>

  <div class="section-title" style="padding: 14px 20px 6px;">log</div>
  <div class="log-area" id="log-area"></div>

</aside>

<footer>
  <span>simulates ESP32-CAM → server pipeline</span>
  <div class="footer-right">
    <div id="latency-bar">
      latency
      <div class="latency-track"><div class="latency-fill" id="lat-fill"></div></div>
      <span id="lat-ms">—</span>
    </div>
    <span id="frame-size-label">frame: —</span>
  </div>
</footer>

<audio id="audio-player"></audio>

<script>
const $ = id => document.getElementById(id);

// ── State ──────────────────────────────────────────────────────────────────
let running      = false;
let intervalId   = null;
let stream       = null;
let framesSent   = 0;
let errors       = 0;
let plays        = 0;
let latencies    = [];
let lastVoiceId  = null;
let fpMs         = 500;   // ms between frames (1000 / fps)

// ── Log ────────────────────────────────────────────────────────────────────
function log(msg, type = '') {
  const area = $('log-area');
  const t = new Date().toLocaleTimeString('en', { hour12: false });
  const el = document.createElement('div');
  el.className = 'log-entry';
  el.innerHTML = `<span class="log-time">${t}</span><span class="log-msg ${type}">${msg}</span>`;
  area.appendChild(el);
  area.scrollTop = area.scrollHeight;
  // keep log bounded
  while (area.children.length > 120) area.removeChild(area.firstChild);
}

// ── Ping ───────────────────────────────────────────────────────────────────
async function pingServer() {
  const url = $('server-url').value.replace(/\/$/, '');
  log(`pinging ${url}/health …`, 'info');
  try {
    const r = await fetch(`${url}/health`, { signal: AbortSignal.timeout(4000) });
    if (r.ok) {
      setStatus('connected');
      log('server reachable ✓', 'ok');
    } else {
      setStatus('error');
      log(`server responded ${r.status}`, 'err');
    }
  } catch(e) {
    setStatus('error');
    log(`unreachable: ${e.message}`, 'err');
  }
}

function setStatus(s) {
  const pill = $('status-pill');
  pill.className = `status-pill ${s}`;
  $('status-text').textContent =
    s === 'connected' ? 'server ok' :
    s === 'error'     ? 'server error' : 'not connected';
}

// ── Camera ─────────────────────────────────────────────────────────────────
async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480, facingMode: 'user' },
    audio: false,
  });
  $('video').srcObject = stream;
  $('overlay-label').textContent = 'live';
  log('camera started', 'ok');
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('video').srcObject = null;
  $('overlay-label').textContent = 'camera off';
}

// ── Capture → JPEG blob ────────────────────────────────────────────────────
function captureJpeg(quality = 0.75) {
  return new Promise(resolve => {
    const v = $('video');
    const c = $('canvas');
    c.width  = v.videoWidth  || 640;
    c.height = v.videoHeight || 480;
    c.getContext('2d').drawImage(v, 0, 0);
    c.toBlob(resolve, 'image/jpeg', quality);
  });
}

// ── Send one frame ─────────────────────────────────────────────────────────
async function sendOnce() {
  const url = $('server-url').value.replace(/\/$/, '');
  const blob = await captureJpeg();

  // flash border
  const wrapper = $('video-wrapper');
  wrapper.classList.add('sending');
  setTimeout(() => wrapper.classList.remove('sending'), 300);

  $('frame-size-label').textContent = `frame: ${(blob.size / 1024).toFixed(1)} KB`;

  const t0 = performance.now();
  try {
    const res = await fetch(`${url}/process`, {
      method: 'POST',
      headers: { 'Content-Type': 'image/jpeg' },
      body: blob,
      signal: AbortSignal.timeout(8000),
    });

    const ms = Math.round(performance.now() - t0);
    trackLatency(ms);

    if (!res.ok) {
      errors++;
      updateStats();
      log(`POST failed ${res.status}`, 'err');
      return;
    }

    const data = await res.json();
    framesSent++;
    updateStats();
    log(`frame ok · ${ms}ms · voice_id=${data.voice_id ?? 'null'}`, data.voice_id ? 'ok' : '');

    if (data.voice_id !== null && data.voice_id !== lastVoiceId) {
      lastVoiceId = data.voice_id;
      await fetchAndPlayVoice(url, data.voice_id);
    }

  } catch(e) {
    errors++;
    updateStats();
    log(`error: ${e.message}`, 'err');
  }
}

// ── Fetch + play MP3 ───────────────────────────────────────────────────────
async function fetchAndPlayVoice(base, vid) {
  const url = `${base}/voice/${vid}`;
  log(`fetching voice ${vid} …`, 'info');
  try {
    const r = await fetch(url, { signal: AbortSignal.timeout(6000) });
    if (!r.ok) { log(`voice fetch failed ${r.status}`, 'warn'); return; }

    const audioBlob = await r.blob();
    const objUrl    = URL.createObjectURL(audioBlob);
    const player    = $('audio-player');

    // revoke old blob URL
    if (player._blobUrl) URL.revokeObjectURL(player._blobUrl);
    player._blobUrl = objUrl;
    player.src = objUrl;

    const box = $('voice-box');
    box.classList.add('playing');
    player.onended = () => box.classList.remove('playing');

    await player.play();
    plays++;
    updateStats();

    $('voice-text').textContent    = `voice_id ${vid} playing…`;
    $('voice-id-badge').textContent = `id: ${vid}`;
    log(`playing voice ${vid}`, 'ok');

  } catch(e) {
    log(`voice error: ${e.message}`, 'err');
  }
}

// ── Session loop ───────────────────────────────────────────────────────────
async function toggleSession() {
  if (running) {
    stopSession();
  } else {
    await startSession();
  }
}

async function startSession() {
  try {
    await startCamera();
  } catch(e) {
    log(`camera error: ${e.message}`, 'err');
    return;
  }
  await pingServer();
  running = true;
  $('btn-start').textContent = '■ stop session';
  $('btn-start').classList.add('running');
  $('btn-snapshot').disabled = false;
  scheduleNext();
  log('session started', 'ok');
}

function stopSession() {
  running = false;
  clearTimeout(intervalId);
  stopCamera();
  $('btn-start').textContent = '▶ start session';
  $('btn-start').classList.remove('running');
  $('btn-snapshot').disabled = true;
  log('session stopped', 'warn');
}

function scheduleNext() {
  if (!running) return;
  intervalId = setTimeout(async () => {
    await sendOnce();
    scheduleNext();
  }, fpMs);
}

// ── FPS ────────────────────────────────────────────────────────────────────
function updateFps(v) {
  fpMs = Math.round(1000 / v);
  $('fps-val').textContent = `${v} fps`;
}

// ── Stats ──────────────────────────────────────────────────────────────────
function updateStats() {
  $('stat-frames').textContent = framesSent;
  $('stat-errors').textContent = errors;
  $('stat-plays').textContent  = plays;
  const avg = latencies.length ? Math.round(latencies.reduce((a,b)=>a+b,0)/latencies.length) : null;
  $('stat-latency').textContent = avg ? `${avg}ms` : '—';
}

function trackLatency(ms) {
  latencies.push(ms);
  if (latencies.length > 30) latencies.shift();
  $('lat-ms').textContent = `${ms}ms`;
  // colour + fill: green <200ms, amber <500ms, red otherwise
  const fill   = $('lat-fill');
  const pct    = Math.min(ms / 1000 * 100, 100);
  fill.style.width = `${pct}%`;
  fill.style.background =
    ms < 200 ? 'var(--accent2)' :
    ms < 500 ? 'var(--warn)' : 'var(--danger)';
}

// ── Boot ───────────────────────────────────────────────────────────────────
log('ui ready — configure server url and press start', 'info');
</script>
</body>
</html>
